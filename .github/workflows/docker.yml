name: CI/CD Pipeline (Docker Hub + AWS EC2)

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartlife-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ui/client
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend:latest


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Docker install
            sudo dnf install docker -y || true

            # Docker start
            sudo systemctl start docker
            sudo systemctl enable docker

            # Docker Compose install
            sudo mkdir -p /usr/local/lib/docker/cli-plugins

            sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose

            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

            mkdir -p /home/ec2-user/app

            cat > /home/ec2-user/app/docker-compose.yml << 'EOF'
            services:

              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/smartlife-backend:latest
                container_name: backend
                restart: always
                ports:
                  - "5001:5001"

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend:latest
                container_name: frontend
                restart: always
                ports:
                  - "3000:3000"
                depends_on:
                  - backend

            EOF

            cd /home/ec2-user/app

            sudo docker compose down || true
            sudo docker compose pull
            sudo docker compose up -d