name: CI/CD Pipeline (Docker Hub + AWS Ready)

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/smartlife-backend ./backend

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend ./ui/client

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/smartlife-backend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend