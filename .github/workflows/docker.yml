name: CI/CD Pipeline (Docker Hub + AWS Ready)

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/smartlife-backend ./backend

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend ./ui/client

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/smartlife-backend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend


  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            docker pull ${{ secrets.DOCKER_USERNAME }}/smartlife-backend
            docker pull ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend

            docker stop backend || true
            docker rm backend || true
            docker stop frontend || true
            docker rm frontend || true

            docker run -d --name backend -p 5001:5001 ${{ secrets.DOCKER_USERNAME }}/smartlife-backend
            docker run -d --name frontend -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend