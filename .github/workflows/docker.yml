name: CI/CD Pipeline (Docker Hub + AWS EC2)

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartlife-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ui/client
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend:latest


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Docker install
            sudo dnf install docker -y || true

            # Docker start
            sudo systemctl start docker
            sudo systemctl enable docker

            # Docker Compose install
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

            mkdir -p /home/ec2-user/app

            cat > /home/ec2-user/app/docker-compose.yml << 'EOF'
            services:

              db:
                image: mcr.microsoft.com/mssql/server:2022-latest
                container_name: db
                restart: always
                environment:
                  SA_PASSWORD: "YourStrong@Pass123"
                  ACCEPT_EULA: "Y"
                ports:
                  - "1433:1433"
                volumes:
                  - sql_data:/var/opt/mssql

              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/smartlife-backend:latest
                container_name: backend
                restart: always
                ports:
                  - "5001:5001"
                environment:
                  ConnectionStrings__DefaultConnection: "Server=db,1433;Database=AuthDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True"
                depends_on:
                  - db

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/smartlife-frontend:latest
                container_name: frontend
                restart: always
                ports:
                  - "3000:5173"
                depends_on:
                  - backend

            volumes:
              sql_data:

            EOF

            cd /home/ec2-user/app

            # YENİLİKLƏR BURADAN BAŞLAYIR
            # Köhnə konteynerlərin adla tapılıb məcburi silinməsi (Conflict xətasının qarşısını alır)
            sudo docker rm -f backend frontend || true
            
            sudo docker compose down || true
            sudo docker compose pull
            sudo docker compose up -d

            # Dangling (istifadəsiz) image-ləri silərək EC2 yaddaşını təmiz saxlamaq
            sudo docker image prune -f