services:
  frontend:
    image: nilhajili27/smartlife-frontend:latest
    restart: always
    ports:
      - "3000:5173"

  api:
#msksm
    image: nilhajili27/smartlife-backend:latest
    restart: always
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=AuthDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: always
    environment:
      SA_PASSWORD: "YourStrong@Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: